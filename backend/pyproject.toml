[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # function call in default argument (FastAPI Depends pattern)
]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = true
check_untyped_defs = false
no_implicit_optional = true
# Ignore missing stubs for third-party libraries
ignore_missing_imports = true
# Disable strict checks that produce false positives with untyped libraries
disable_error_code = ["attr-defined", "union-attr", "call-arg"]
