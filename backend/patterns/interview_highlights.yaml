id: interview_highlights
name: "Interview Highlights"
description: "Extract key quotes, claims, and insights from interviews"
icon: "🎤"
category: "extraction"

inputs:
  - transcript
  - video_title
  - channel

system_prompt: |
  You are an expert at extracting valuable content from interviews and conversations.
  Focus on capturing the most interesting, revealing, or important moments.
  Preserve the authentic voice of the speakers when quoting.

user_prompt: |
  Extract the highlights from this interview or conversation.

  VIDEO: {video_title}
  CHANNEL: {channel}

  TRANSCRIPT:
  ---
  {transcript}
  ---

  Provide your highlights in the following format:

  ## Key Quotes
  The most memorable or impactful statements:
  > "Quote 1" - [Speaker if known]
  > "Quote 2" - [Speaker if known]
  > "Quote 3" - [Speaker if known]

  ## Main Claims & Opinions
  What positions or beliefs did the interviewee express?
  - Claim 1: [brief explanation]
  - Claim 2: [brief explanation]

  ## Interesting Revelations
  Any surprising disclosures, stories, or insights shared:
  - [Revelation 1]
  - [Revelation 2]

  ## Points of Disagreement
  Any areas where speakers disagreed or pushed back:
  - [Topic]: [brief description of disagreement]

  ## Background Context
  Relevant information about the speaker(s) or topic mentioned:
  - [Context point 1]
  - [Context point 2]

output_format: markdown
