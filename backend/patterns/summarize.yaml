id: summarize
name: "Summarize"
description: "TL;DR, key takeaways, main topics, and notable quotes"
icon: "📝"
category: "summary"

inputs:
  - transcript
  - video_title
  - channel

system_prompt: |
  You are an expert content analyst. Create clear, actionable summaries.
  Focus on the most valuable information: insights, takeaways, and memorable moments.
  Be concise but preserve key details. Start takeaways with action verbs.

user_prompt: |
  Summarize this video.

  VIDEO: {video_title}
  CHANNEL: {channel}

  TRANSCRIPT:
  ---
  {transcript}
  ---

  Provide your summary in the following format:

  ## TL;DR
  2-3 sentences capturing the essence of the content.

  ## Key Takeaways
  5-7 actionable insights. Start each with an action verb.

  ## Main Topics
  3-5 central themes discussed.

  ## Notable Quotes
  2-3 impactful quotes representing key ideas (omit if none stand out).

output_format: markdown
