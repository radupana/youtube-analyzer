[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-agent-kit"
version = "0.1.0"
description = "Simple CLI tool for analyzing YouTube channels with LLMs"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Radu Pana", email = "radupana@ymail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "youtube-transcript-api>=0.6.0",
    "google-api-python-client>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "google-genai>=1.0.0",
    "yt-dlp>=2024.0.0",
    "openai-whisper>=20240930",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
all = ["yt-agent-kit[gemini,openai,anthropic]"]

[project.scripts]
yt-agent-kit = "yt_agent_kit.__main__:main"

[project.urls]
"Homepage" = "https://github.com/radupana/youtube-analyzer"
"Bug Tracker" = "https://github.com/radupana/youtube-analyzer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/", "backend/"]

[[tool.mypy.overrides]]
module = [
    "youtube_transcript_api",
    "youtube_transcript_api._errors",
    "googleapiclient",
    "googleapiclient.discovery",
    "chromadb",
    "sentence_transformers",
    "google",
    "google.*",
    "whisper",
    "yt_dlp",
    "yt_dlp.utils",
    "pytube",
]
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 88
force_single_line = false
combine_as_imports = true
order_by_type = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
known_first_party = ["yt_agent_kit"]
