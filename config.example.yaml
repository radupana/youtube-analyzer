# ============================================================================
# YouTube Analyzer - Conversational Agent Configuration
# ============================================================================
# This tool uses a conversational interface to gather your analysis intent.
# Simply run: python -m yt_agent_kit
#
# The agent will ask you:
#   1. Which YouTube channel to analyze
#   2. What you're looking to learn from the analysis
#   3. Your preferred output format (human-readable, JSON, or Markdown)
# ============================================================================

# LLM provider settings
llm:
  provider: "gemini"  # Options: gemini, openai, anthropic, custom
  api_key: "${GEMINI_API_KEY}"  # Environment variable recommended
  model: "gemini-2.0-flash"  # Cost-effective option

# YouTube Data API v3 key
youtube_api_key: "${YOUTUBE_API_KEY}"  # Can be same as GEMINI_API_KEY for Google

# Default settings (optional)
output_file: "results.json"  # Where to save analysis results
max_videos: 200  # Safety limit on videos to process

# Embedding settings (optional - all run locally, no API costs)
embeddings:
  model: "all-MiniLM-L6-v2"  # Local model (~80MB download on first run)
  chunk_size: 1200  # Characters per chunk
  chunk_overlap: 200  # Overlap between chunks

# Search settings (optional)
search:
  top_k: 8  # Number of chunks to retrieve per query
